name: Clear old test artifacts

# One-time initial cleanup on creation; later runs are manual only.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-test-artifacts.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  delete-stored-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Remove stored GitHub Actions artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          while :; do
            ids="$(gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id')"
            if [[ -z "$ids" ]]; then
              break
            fi
            while IFS= read -r id; do
              [[ "$id" =~ ^[0-9]+$ ]] || exit 1
              gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id" >/dev/null
              deleted=$((deleted + 1))
              if (( deleted % 50 == 0 )); then
                echo "Deleted $deleted test artifacts"
              fi
              sleep 0.3
            done <<< "$ids"
          done
          echo "Cleanup complete. Deleted $deleted artifacts. Source files, commits, branches, releases and workflow runs were not deleted."
